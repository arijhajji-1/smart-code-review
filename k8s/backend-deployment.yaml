apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: code-reviewer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: code-reviewer-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: code-reviewer-secrets
                  key: GROQ_API_KEY
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: code-reviewer-secrets
                  key: FRONTEND_URL